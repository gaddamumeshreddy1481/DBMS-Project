<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Sign-In</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen px-4">
  <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
    <h2 class="text-3xl font-bold mb-6 text-center text-gray-800">
      <i class="fas fa-user-graduate text-blue-500 mr-2"></i> Student Sign-In
    </h2>

    <form action="{{ url_for('student_signin') }}" method="POST">
      <div class="mb-4">
        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
        <div class="relative mt-1">
          <input type="email" id="email" name="email" class="p-2 pl-10 border border-gray-300 rounded w-full" required>
          <i class="fas fa-envelope absolute top-2.5 left-3 text-gray-400"></i>
        </div>
      </div>

      <div class="mb-6">
        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
        <div class="relative mt-1">
          <input type="password" id="password" name="password" class="p-2 pl-10 border border-gray-300 rounded w-full" required>
          <i class="fas fa-lock absolute top-2.5 left-3 text-gray-400"></i>
        </div>
      </div>

      <button type="submit" class="w-full bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 transition">
        <i class="fas fa-sign-in-alt mr-2"></i>Sign In
      </button>

      <div class="mt-4 text-center">
        <a href="{{ url_for('student_apply') }}" class="text-blue-500 hover:underline">Don't have an account? Apply</a>
      </div>
      <div class="text-center mt-2">
        <a href="{{ url_for('home') }}" class="text-blue-500 hover:underline">Back to Home</a>
      </div>
    </form>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="mt-6">
          {% for category, message in messages %}
            <div class="p-2 bg-red-100 text-red-700 rounded">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
  </div>
</body>
</html>
