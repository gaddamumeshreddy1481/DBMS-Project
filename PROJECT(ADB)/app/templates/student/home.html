<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Dashboard - College Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen">
  <!-- Navigation -->
  <nav class="bg-white shadow p-4">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold text-gray-700">Student Dashboard</h1>
      <a href="{{ url_for('student_select_semester') }}" class="block p-4 border-b hover:bg-blue-50">
        <i class="fas fa-book-open mr-2"></i> Register for Courses
      </a>
      <a href="{{ url_for('student_view_enrollments') }}" class="block p-4 border-b hover:bg-blue-50">
        <i class="fas fa-list-check mr-2"></i> My Enrollments
      </a>
      <a href="{{ url_for('student_payments') }}" class="block p-4 border-b hover:bg-blue-50">
        <i class="fas fa-credit-card mr-2"></i> Make Payments
      </a>
      
      <a href="{{ url_for('student_logout') }}" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">
        <i class="fas fa-sign-out-alt mr-1"></i> Logout
      </a>

    </div>
  </nav>

  <!-- Main -->
  <main class="container mx-auto px-4 py-8">

    <!-- Quick Actions -->
    <section class="mb-8">
      <h2 class="text-2xl font-bold mb-4">Quick Actions</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="bg-white p-6 rounded-lg shadow hover:shadow-md transition">
          <h3 class="text-xl font-semibold mb-2">
            <i class="fas fa-clipboard-list text-blue-500 mr-2"></i> Course Registration
          </h3>
          <p class="text-gray-600 mb-4">Register for new courses and manage your schedule.</p>
          <a href="{{ url_for('student_select_semester') }}" class="text-blue-600 hover:underline">Go to Registration</a>
        </div>
      </div>
    </section>

    <!-- Current Courses -->
    
    

  </main>
</body>
</html>
