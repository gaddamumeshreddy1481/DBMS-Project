<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Sign-In</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
  <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-sm">
    <div class="flex flex-col items-center mb-6">
      <div class="bg-blue-100 text-blue-600 p-3 rounded-full mb-2">
        <i class="fas fa-user-shield text-2xl"></i>
      </div>
      <h2 class="text-2xl font-bold">Admin Sign-In</h2>
    </div>

    <form action="{{ url_for('admin_signin') }}" method="POST" class="space-y-4">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
        <div class="flex items-center border border-gray-300 rounded mt-1">
          <span class="px-3 text-gray-500">
            <i class="fas fa-envelope"></i>
          </span>
          <input type="email" id="email" name="email" class="w-full p-2 focus:outline-none rounded-r" required>
        </div>
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
        <div class="flex items-center border border-gray-300 rounded mt-1">
          <span class="px-3 text-gray-500">
            <i class="fas fa-lock"></i>
          </span>
          <input type="password" id="password" name="password" class="w-full p-2 focus:outline-none rounded-r" required>
        </div>
      </div>

      <div class="flex items-center justify-between">
        <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 w-full">
          <i class="fas fa-sign-in-alt mr-2"></i> Sign In
        </button>
      </div>

      <div class="text-center mt-4 space-y-2">
        <a href="{{ url_for('home') }}" class="text-blue-500 hover:text-blue-600 inline-block">
          <i class="fas fa-house mr-1"></i>Home
        </a>
        <br>
        <a href="{{ url_for('admin_create') }}" class="text-blue-500 hover:text-blue-600 inline-block">
          <i class="fas fa-user-plus mr-1"></i>Create Admin
        </a>
      </div>
    </form>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="mt-4">
        {% for category, message in messages %}
          <div class="p-2 bg-red-100 text-red-700 border border-red-300 rounded text-sm">
            <i class="fas fa-exclamation-circle mr-2"></i>{{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}
    {% endwith %}
  </div>
</body>
</html>
