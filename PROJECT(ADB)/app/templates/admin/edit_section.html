<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Edit Section</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-200 text-gray-800 min-h-screen flex flex-col">
  <nav class="bg-gray-800 text-white p-4">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold">Edit Section</h1>
      <a href="{{ url_for('admin_logout') }}" class="bg-red-500 px-3 py-2 rounded hover:bg-red-600">Logout</a>
    </div>
  </nav>
  <main class="flex-grow container mx-auto p-6">
    <section class="bg-white rounded-lg shadow p-6 max-w-2xl mx-auto">
      <h2 class="text-2xl font-bold mb-4">Edit Section</h2>
      <form method="POST" action="" class="mb-8">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700">Section ID</label>
            <input type="text" name="section_id" value="{{ section.section_id }}" readonly class="mt-1 block w-full rounded-md border-gray-300 shadow-sm bg-gray-100">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Course</label>
            <select name="course_id" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
              <option value="">Select Course</option>
              {% for course in courses %}
              <option value="{{ course._id }}" {% if section.course_id == course._id %}selected{% endif %}>{{ course.course_code }}</option>
              {% endfor %}
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Instructor</label>
            <select name="instructor_id" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
              <option value="">Select Instructor</option>
              {% for instructor in instructors %}
              <option value="{{ instructor._id }}" {% if section.instructor_id == instructor._id %}selected{% endif %}>{{ instructor.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Semester</label>
            <select name="semester_id" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
              <option value="">Select Semester</option>
              {% for semester in semesters %}
              <option value="{{ semester._id }}" {% if section.semester_id == semester._id %}selected{% endif %}>{{ semester.semester_name }}</option>
              {% endfor %}
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Room Number</label>
            <input type="text" name="room_number" value="{{ section.room_number }}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Seat Capacity</label>
            <input type="number" name="seat_capacity" value="{{ section.seat_capacity }}" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
          </div>
          <div class="col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-2">Schedule</label>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <fieldset>
                  <legend class="text-sm font-medium text-gray-700 mb-2">Days</legend>
                  <div class="space-y-2">
                    {% set days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'] %}
                    {% for day in days %}
                    <label class="inline-flex items-center">
                      <input type="checkbox" name="schedule_days" value="{{ day }}" {% if section.schedule and day in section.schedule|map(attribute='day')|list %}checked{% endif %} class="rounded border-gray-300 text-blue-600 shadow-sm">
                      <span class="ml-2">{{ day }}</span>
                    </label>
                    {% endfor %}
                  </div>
                </fieldset>
              </div>
              <div>
                <div class="mb-4">
                  <label class="block text-sm font-medium text-gray-700">Start Time</label>
                  <input type="time" name="start_time" value="{{ section.schedule[0].start_time if section.schedule }}" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700">End Time</label>
                  <input type="time" name="end_time" value="{{ section.schedule[0].end_time if section.schedule }}" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="mt-6 flex justify-between">
          <a href="{{ url_for('admin_sections') }}" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600">Cancel</a>
          <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">Update Section</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
