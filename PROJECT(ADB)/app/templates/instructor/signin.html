<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Instructor Sign-In</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white shadow-xl rounded-xl p-8 w-full max-w-md">
    
    <!-- Header -->
    <div class="text-center mb-6">
      <div class="text-blue-600 text-4xl mb-2">
        <i class="fas fa-chalkboard-teacher"></i>
      </div>
      <h2 class="text-2xl font-bold text-gray-800">Instructor Sign-In</h2>
      <p class="text-sm text-gray-500 mt-1">Access your teaching dashboard</p>
    </div>

    <!-- Form -->
    <form action="{{ url_for('instructor_signin') }}" method="POST">
      <div class="mb-4">
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" id="email" name="email" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400" required>
      </div>

      <div class="mb-6">
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" id="password" name="password" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400" required>
      </div>

      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 transition">Sign In</button>
    </form>

    <!-- Links -->
    <div class="mt-6 text-center">
      <a href="{{ url_for('instructor_apply') }}" class="text-sm text-blue-600 hover:underline">Don't have an account? Apply Now</a><br>
      <a href="{{ url_for('home') }}" class="text-sm text-gray-500 hover:underline mt-2 inline-block">← Back to Home</a>
    </div>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="mt-4">
          {% for category, message in messages %}
            <div class="p-3 rounded text-sm {{ 'bg-red-100 text-red-700' if category == 'error' else 'bg-green-100 text-green-700' }}">
              {{ message }}
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

  </div>
</body>
</html>
